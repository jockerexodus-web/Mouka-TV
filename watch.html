<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture — Mouka Streaming</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">M</div>
        <div>
          <div class="logo-text gradient-text">MOUKA</div>
          <div class="logo-sub">STREAMING</div>
        </div>
      </a>
      <a href="index.html" class="back-btn">← Retour</a>
    </div>
  </nav>

  <!-- PLAYER -->
  <main class="container watch-page">
    <div class="player-wrapper">
      <video id="player" controls playsinline width="100%"></video>
    </div>

    <div id="infos" class="watch-info"></div>

    <div class="section-title" style="margin-top:40px">
      <h2>À voir aussi</h2>
      <div class="line"></div>
    </div>
    <div id="suggestions" class="grid"></div>
  </main>

  <footer class="footer">
    <p>© 2025 — Créé par <span class="highlight">Zylva Labs</span></p>
  </footer>

  <script>
    const id = new URLSearchParams(window.location.search).get('id');

    fetch('api.json')
      .then(r => r.json())
      .then(data => {
        const film = data.videos.find(v => v.id == id);

        // Vidéo introuvable
        if (!film) {
          document.getElementById('player').outerHTML = '<p class="error">❌ Vidéo introuvable</p>';
          return;
        }

        // Charge la vidéo
        const player = document.getElementById('player');
        player.src = film.video;
        player.poster = film.cover;
        document.title = film.titre + ' - Mouka Streaming';

        // Infos sous le player
        document.getElementById('infos').innerHTML = `
          <h1>${film.titre}</h1>
          <div class="hero-meta">
            <span class="badge">${film.type.toUpperCase()}</span>
            ${film.saison ? `<span>Saison ${film.saison}</span>` : ''}
            ${film.episode ? `<span>Épisode ${film.episode}</span>` : ''}
          </div>
          <p>${film.description}</p>
        `;

        // Suggestions (même type, sauf le film actuel)
        const sugg = data.videos
          .filter(v => v.type === film.type && v.id != film.id)
          .slice(0, 5);

        const box = document.getElementById('suggestions');
        if (sugg.length === 0) {
          box.innerHTML = '<p class="empty">Aucune suggestion</p>';
        } else {
          box.innerHTML = sugg.map(v => `
            <a href="watch.html?id=${v.id}" class="card">
              <div class="card-cover">
                <img src="${v.cover}" alt="${v.titre}" loading="lazy">
                <div class="card-overlay"><div class="play-btn">▶</div></div>
                <span class="card-type">${v.type}</span>
              </div>
              <div class="card-info">
                <h3>${v.titre}</h3>
              </div>
            </a>
          `).join('');
        }
      })
      .catch(err => {
        console.error('Erreur:', err);
        document.getElementById('player').outerHTML = '<p class="error">❌ Erreur de chargement</p>';
      });
  </script>
</body>
    </html>
